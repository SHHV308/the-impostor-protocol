# Render Blueprint: one Node web service (serves the built client + Socket.IO) and a managed PostgreSQL.
databases:
  - name: impostor-db
    databaseName: impostor
    user: impostor
    plan: free

services:
  - type: web
    name: the-impostor-protocol
    runtime: node
    plan: free
    # devDependencies are needed to build (vite, esbuild, typescript)
    buildCommand: npm ci --include=dev && npm run build
    # apply pending migrations, then start. Safe to run on every boot.
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: impostor-db
          property: connectionString
