name: Deploy free VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-vm-production
  cancel-in-progress: false

jobs:
  check-configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check deployment configuration
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          missing=()
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS POSTGRES_PASSWORD APP_HOSTNAME; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              printf '::error::Configure these GitHub Actions values before deploying: %s\n' "${missing[*]}"
              exit 1
            fi
            {
              echo "Deployment skipped: configure these repository Actions secrets/variables, then run this workflow: ${missing[*]}."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$ORACLE_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::ORACLE_HOST must be an IP address or hostname."; exit 1; }
          [[ "$ORACLE_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::ORACLE_USER is invalid."; exit 1; }
          [[ "$APP_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ && "$APP_HOSTNAME" == *.* ]] || { echo "::error::APP_HOSTNAME must be a DNS hostname."; exit 1; }
          [[ "$POSTGRES_PASSWORD" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "::error::POSTGRES_PASSWORD must be 64 hexadecimal characters."; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check-configuration
    if: needs.check-configuration.outputs.ready == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64 image
        run: docker build --tag "impostor:${GITHUB_SHA}" .

      - name: Prepare deployment files
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nAPP_HOSTNAME=%s\nIMAGE_TAG=%s\n' \
            "$POSTGRES_PASSWORD" "$APP_HOSTNAME" "$GITHUB_SHA" > /tmp/impostor.env
          docker save "impostor:${GITHUB_SHA}" --output /tmp/impostor.tar
          scp -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/impostor.tar deploy/compose.yaml deploy/Caddyfile /tmp/impostor.env \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/"

      - name: Deploy and verify
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ORACLE_USER@$ORACLE_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -d -m 755 /opt/impostor
          sudo install -m 600 /tmp/impostor.env /opt/impostor/.env
          sudo install -m 644 /tmp/compose.yaml /opt/impostor/compose.yaml
          sudo install -m 644 /tmp/Caddyfile /opt/impostor/Caddyfile
          sudo docker load --input /tmp/impostor.tar
          sudo docker compose --env-file /opt/impostor/.env -f /opt/impostor/compose.yaml up -d --wait --wait-timeout 180
          sudo docker image prune -f
          rm -f /tmp/impostor.env /tmp/compose.yaml /tmp/Caddyfile /tmp/impostor.tar
          REMOTE
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-connrefused \
            "https://${APP_HOSTNAME}/api/health"
